ha_url = "http://homeassistant.local:8123/"
ha_token = "mysuperlongtoken"  # Optional - can use OAuth instead via: halinuxcompanion --oauth
device_id = "computername"
device_name = "whatever you want can be left empty"
manufacturer = "whatever you want can be left empty"
model = "Computer"
local_http_host = "192.168.1.15"
local_http_port = 8400
refresh_interval = 15
loglevel = "INFO"
storage_backend = "auto"  # "file", "libsecret", or "auto" (tries libsecret first)

# Hardware configuration
[hardware.battery]
enabled = true
implementation = "psutil"  # or "upower" for more detailed battery information

[hardware.network]
enabled = true
interfaces = ["eth0", "wlan0"]  # List of interfaces to monitor
show_status = true  # Show up/down status
show_counters = true  # Show TX/RX byte counters
show_ip_addresses = false  # Show IP addresses

[hardware.cpu]
enabled = true

[hardware.memory]
enabled = true

[hardware.camera]
enabled = true

[hardware.lid]
enabled = true

[hardware.bluetooth]
enabled = true
devices = [
    "AA:BB:CC:DD:EE:FF",
    "11:22:33:44:55:66"
]

[hardware.status]
enabled = true

[hardware.uptime]
enabled = true

[hardware.temperature]
enabled = true
# TODO: Add sensor filtering when implemented

[notifications]
enabled = true
url_program = "xdg-open"

[notifications.commands]
[notifications.commands.command_suspend]
name = "Suspend"
command = ["systemctl", "suspend"]

[notifications.commands.command_poweroff]
name = "Power off"
command = ["systemctl", "poweroff"]

[notifications.commands.command_reboot]
name = "Reboot"
command = ["systemctl", "reboot"]

[notifications.commands.command_hibernate]
name = "Hibernate"
command = ["systemctl", "hibernate"]

[notifications.commands.command_open_ha]
name = "Open Home Assistant"
command = ["xdg-open", "http://homeassistant.local:8123/"]

[notifications.commands.command_open_spotify]
name = "Open Spotify Flatpak"
command = ["flatpak", "run", "com.spotify.Client"]
