[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halinuxcompanion"
version = "0.1.0"
description = "Linux desktop companion for Home Assistant - provides sensor data and notifications"
readme = "README.md"
authors = [
    {name = "Home Assistant Linux Companion Contributors"},
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["home-assistant", "linux", "desktop", "sensors", "notifications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "pydantic>=2",
    "aiohttp>=3.9.5",
    "psutil>=5.8.0",
    "dbus-next>=0.2.3",
    "pydantic>=2.10.4",
    "greenlet>=3.1.1",
    "toml>=0.10.2",
    "pint>=0.23",
    "jinja2>=3.1.4",
    "xdg-base-dirs>=6.0.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-aiohttp>=1.0.5",
    "pytest-cov>=4.1.0",
    "coverage>=7.3.2",
    "tox>=4.11.3",
    "black",
    "mypy",
    "types-tabulate",
    "bandit[toml]>=1.7.5",
    "safety>=3.0.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
halinuxcompanion = "halinuxcompanion.__main__:run"

[project.urls]
Homepage = "https://github.com/benleb/halinuxcompanion"
Repository = "https://github.com/benleb/halinuxcompanion"
Issues = "https://github.com/benleb/halinuxcompanion/issues"

[tool.setuptools.packages.find]
include = ["halinuxcompanion*"]

[tool.setuptools.package-data]
halinuxcompanion = ["resources/*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests", "halinuxcompanion"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "requires_hardware: marks tests as requiring real hardware (deselect with '-m \"not requires_hardware\"')",
]

[tool.coverage.run]
branch = true
source = ["halinuxcompanion"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EXE",   # flake8-executable
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "PL",    # pylint
    "TRY",   # tryceratops
    "NPY",   # NumPy-specific rules
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
    "TRY003",  # long exception messages
    "ERA001",  # commented-out code (sometimes useful for debugging)
    "PLR0912",  # too many branches (sometimes necessary)
    "PLW0603",  # global statement (needed for session management)
    "G004",  # logging with f-string (more readable)
    "PTH123",  # open() vs Path.open() (both are fine)
    "T201",  # print statements (needed in CLI and scripts)
    "RUF001",  # ambiguous unicode (not a real issue)
    "RUF003",  # ambiguous unicode in comments
    "EXE001",  # shebang in non-executable (scratch files)
    "TID252",  # relative imports from parent (fine for internal packages)
    "TC001",   # move imports to TYPE_CHECKING (not always beneficial)
    "TC004",   # move imports out of TYPE_CHECKING (conflicts with TC001)
    "ARG001",  # unused function arguments (sometimes needed for interfaces)
    "A002",    # shadowing builtins (sometimes id is the best name)
    "A005",    # module shadows stdlib (our secrets.py is fine)
    "B023",    # function doesn't bind loop variable (often false positive)
    "PTH207",  # prefer Path.glob (glob is fine)
    "RET504",  # unnecessary assignment before return (sometimes clearer)
    "RUF006",  # asyncio dangling task (fire-and-forget is fine)
    "RUF012",  # mutable class attributes (Pydantic handles these)
    "TRY300",  # consider returning exception (not always appropriate)
    "TRY301",  # raise within try (sometimes necessary)
    "TRY401",  # redundant exception in logging.exception (false positives)
    "B006",    # mutable default argument (handled properly)
    "B007",    # unused loop variable (sometimes intentional)
    "B904",    # raise without from inside except (not always needed)
    "DTZ005",  # datetime without timezone (fixing these gradually)
    "SIM105",  # use contextlib.suppress (explicit is clearer)
    "UP038",   # use | in isinstance (not always clearer)
    "EXE005",  # shebang with whitespace (minor issue)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]  # allow print in tests
"**/__main__.py" = ["T20"]  # allow print in CLI

[tool.ruff.lint.isort]
known-first-party = ["halinuxcompanion"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "scratch/",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310,py311,py312,py313
skipsdist = True

[testenv]
deps =
    -r requirements.txt
    pytest
    pytest-asyncio
    pytest-aiohttp
    pytest-cov
    pytest-socket
commands = pytest --cov=halinuxcompanion {posargs}
"""
