version: '3.8'

services:
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: ha_test
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Run halinuxcompanion in container with DBus access
  # Uncomment when testing containerized companion
  # companion:
  #   build: ../..
  #   container_name: halinuxcompanion_test
  #   volumes:
  #     # Mount DBus system socket
  #     - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
  #     # Mount machine-id for DBus
  #     - /etc/machine-id:/etc/machine-id:ro
  #     # Share network namespace for DBus access
  #   network_mode: host
  #   environment:
  #     - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
  #   depends_on:
  #     - homeassistant
