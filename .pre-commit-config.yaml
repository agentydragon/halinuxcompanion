exclude: ^scratch/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      # Syntax checks
      - id: check-ast  # valid Python parse
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^(\.|references/)  # exclude dotfiles and references
      # Python specific
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: name-tests-test
        args: ['--pytest-test-first']

  # Ruff = linter + import sorter + formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies:
          # deps of gatelet that still lack bundled typings
          - types-python-dateutil  # indirect via httpx / fastapi
          - homeassistant-stubs
          - types-Markdown
          - types-toml
          - types-tabulate
          - pydantic>=2

  # Buildifier for Bazel files
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.0
    hooks:
      - id: buildifier
      - id: buildifier-lint
